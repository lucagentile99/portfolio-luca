<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>Luca Gentile — Estrategia, contenido y marketing digital</title>
    <meta
      name="description"
      content="Portfolio de Luca Gentile: campañas integrales, estrategia de contenido, dirección creativa, social media y Meta Ads para marcas y proyectos."
    />
    <meta name="author" content="Luca Martín Gentile" />
    <meta name="theme-color" content="#f3ebdd" />
    <!--
      No hay todavía un dominio propio: se omiten a propósito canonical,
      og:url y la URL del JSON-LD para no publicar una URL de ejemplo.
      Cuando exista el dominio definitivo, completar siteUrl en
      src/data/siteConfig.ts y agregar acá:
        <link rel="canonical" href="https://TU-DOMINIO.com/" />
        <meta property="og:url" content="https://TU-DOMINIO.com/" />
      y el campo "url" dentro del JSON-LD de más abajo. El og:image de abajo
      usa una ruta relativa (/images/og/og-image.png); cuando exista el
      dominio, los scrapers de redes sociales van a necesitar la URL
      absoluta (https://TU-DOMINIO.com/images/og/og-image.png).
    -->

    <!-- Open Graph -->
    <meta property="og:type" content="profile" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:site_name" content="Luca Gentile — Portfolio" />
    <meta property="og:title" content="Luca Gentile — Estrategia, contenido y marketing digital" />
    <meta
      property="og:description"
      content="Portfolio de Luca Gentile: campañas integrales, estrategia de contenido, dirección creativa, social media y Meta Ads para marcas y proyectos."
    />
    <meta property="og:image" content="/images/og/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Luca Gentile — Estrategia, contenido y marketing digital" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Luca Gentile — Estrategia, contenido y marketing digital" />
    <meta
      name="twitter:description"
      content="Portfolio de Luca Gentile: campañas integrales, estrategia de contenido, dirección creativa, social media y Meta Ads para marcas y proyectos."
    />
    <meta name="twitter:image" content="/images/og/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Instrument+Serif:ital@1&display=swap"
      rel="stylesheet"
    />

    <script type="application/ld+json">

        "@context": "https://schema.org",

        "name": "Luca Martín Gentile",
        "jobTitle": "Profesional de comunicación y marketing digital",
        "description": "Desarrollo campañas integrales que conectan estrategia, creatividad, contenido y performance: dirección creativa, social media y Meta Ads.",
        "email": "mailto:lucagentile2012@gmail.com",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Capital Federal",
          "addressCountry": "AR"
        },
        "sameAs": ["https://linkedin.com/in/luca-martin-gentile"]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
